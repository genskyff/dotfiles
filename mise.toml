[settings]
dotfiles.root = "."

[dotfile_groups.common]
root = "platform/common"
mode = "copy"
exclude = [".ssh"]

[dotfile_groups.common.entries]
"~/.config/starship.toml" = { mode = "template" }
"~/.delta.gitconfig" = { mode = "template" }
"~/.gitconfig" = { mode = "template" }
"~/.gitignore_global" = { mode = "template" }
